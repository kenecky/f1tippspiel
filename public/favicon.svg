    </linearGradient>
    <linearGradient id="red" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a80500"/><stop offset="0.6" stop-color="#ff2a1f"/><stop offset="1" stop-color="#ff7a45"/>
